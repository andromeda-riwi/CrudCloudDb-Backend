
services:
  api:
    container_name: ccd_api
    build:
      context: .
      dockerfile: ./src/CCD.Api/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}

      ConnectionStrings__DefaultConnection: ${DEFAULT_CONNECTION:?DEFAULT_CONNECTION no definido}
      ConnectionStrings__AdminPostgresConnection: ${ADMIN_POSTGRES_CONNECTION:?ADMIN_POSTGRES_CONNECTION no definido}
      ConnectionStrings__AdminMySqlConnection: ${ADMIN_MYSQL_CONNECTION:?ADMIN_MYSQL_CONNECTION no definido}
      ConnectionStrings__AdminSqlServerConnection: ${ADMIN_SQLSERVER_CONNECTION:?ADMIN_SQLSERVER_CONNECTION no definido}

      AppSettings__Token: ${JWT_SECRET_TOKEN:?JWT_SECRET_TOKEN no definido}

      MercadoPago__AccessToken: ${MERCADOPAGO_ACCESS_TOKEN:?MERCADOPAGO_ACCESS_TOKEN no definido}
      MercadoPago__WebhookSecret: ${MERCADOPAGO_WEBHOOK_SECRET:?MERCADOPAGO_WEBHOOK_SECRET no definido}

      SendGrid__ApiKey: ${SENDGRID_API_KEY:-}
      SendGrid__FromEmail: ${SENDGRID_FROM_EMAIL:-no-reply@example.com}
      SendGrid__FromName: ${SENDGRID_FROM_NAME:-ApexDb Team}

      App__DashboardUrl: ${APP_DASHBOARD_URL:-https://andromeda.andrescortes.dev/dashboard}
    volumes:
      - ./logs:/app/logs
    networks:
      - ccd_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/swagger/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres_server:
    container_name: postgres_server
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD no definido}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ccd_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 512m

  mysql_server:
    container_name: mysql_server
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD no definido}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mysql_db}
      MYSQL_USER: ${MYSQL_USER:-mysql_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD no definido}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ccd_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 512m

  mongodb_server:
    container_name: mongodb_server
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD no definido}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-mongodb}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - ccd_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 256m

  sqlserver2022:
    container_name: sqlserver2022
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:?SQLSERVER_SA_PASSWORD no definido}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - ccd_network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${SQLSERVER_SA_PASSWORD}", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 2g

volumes:
  postgres_data:
  mysql_data:
  mongodb_data:
  sqlserver_data:

networks:
  ccd_network:
    driver: bridge
